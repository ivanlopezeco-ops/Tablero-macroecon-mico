name: Actualización diaria

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 18:40 hora Argentina: cierre de mercado (caución, futuros, A3500)
    - cron: "10 12 * * 1-6"   # 09:10 hora Argentina: lo que el BCRA, el BCRD y EE.UU. publican de noche
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - "config/**"
      - "site/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # la última versión de main, con los datos que dejó la corrida anterior
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - run: python pipeline/run.py
      - name: Guardar datos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Datos $(date -u +%Y-%m-%d)" || echo "sin cambios"
          # si otra corrida empujó datos mientras tanto, gana la base de esta corrida (es la más nueva)
          git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours --no-edit)
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
