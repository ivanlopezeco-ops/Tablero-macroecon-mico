name: Actualización del tablero

# GitHub no garantiza el horario de los cron (en oct-26 se vieron atrasos de 2 a 4,5 horas).
# Por eso corre cada hora en la rueda: aunque una corrida se atrase o se saltee, la siguiente toma el dato.
# Horarios en UTC (Argentina = UTC-3).
on:
  schedule:
    - cron: "7 13-22 * * 1-5"   # 10:07 a 19:07 hora argentina, cada hora: datos del día (BYMA, Ámbito, A3, Yahoo)
    - cron: "7 0 * * 2-6"       # 21:07: cierres, A3500 del día y lo que el BCRA publica a la tarde
    - cron: "7 11 * * 1-6"      # 08:07: lo que el BCRD, el Tesoro de EE.UU. y el BCRA publican de noche (sábado: historia completa)
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - "config/**"
      - "site/**"
      - "requirements.txt"
      - "tests/test_*.py"
      - "tests/test_frontend.cjs"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      # El entorno de producción admite solo main. Las otras ramas validan sin desplegar.
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'validacion-ipom' }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # La base de datos vive en la rama "datos", con un solo commit que se reemplaza en cada corrida:
      # así el repositorio no crece con cada actualización horaria.
      - name: Traer la base acumulada
        run: |
          if git fetch --depth 1 origin datos; then
            rm -rf data && git checkout FETCH_HEAD -- data && git reset -q data
          fi
          ls -la data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_regresiones.py"
      - run: python -m unittest discover -s tests -p "test_bopreal_reservas.py"
      - run: python -m unittest discover -s tests -p "test_ampliacion.py"
      - run: python -m unittest discover -s tests -p "test_ipom.py"
      - run: python -m unittest discover -s tests -p "test_balance.py"
      - run: node --test tests/test_frontend.cjs
      - id: corrida
        run: python pipeline/run.py
      - name: Validar fuentes nuevas antes de publicar
        run: python pipeline/ipom.py --verificar site/data.json
      - name: Conciliar balance y comprobar informe PDF
        run: python pipeline/balance_control.py site/data.json
      - name: Evidencia de actualización
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacion-ipom
          path: |
            data/ipom.json
            data/estado.json
            data/validacion.md
          retention-days: 7
      - name: Guardar la base en la rama datos
        if: always() && github.ref == 'refs/heads/main' && steps.corrida.outcome != 'skipped' && steps.corrida.outcome != ''
        run: |
          rm -rf /tmp/datos && mkdir -p /tmp/datos && cp -r data /tmp/datos/
          cd /tmp/datos
          git init -q -b datos
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Datos $(date -u +%Y-%m-%dT%H:%M)Z"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
      # Aviso por mail: un issue con la etiqueta alerta-datos se abre si una fuente lleva horas caída o una serie
      # se atrasa, recibe un comentario solo cuando cambia la lista de problemas y se cierra cuando todo vuelve a andar.
      - name: Avisar fallas
        id: alerta
        if: always() && github.ref == 'refs/heads/main'
        env:
          PIPELINE_FALLO: ${{ job.status == 'failure' && '1' || '0' }}
        run: python pipeline/alerta.py
      - name: Abrir, actualizar o cerrar el issue de alerta
        if: always() && github.ref == 'refs/heads/main' && steps.alerta.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HAY: ${{ steps.alerta.outputs.hay }}
          FIRMA: ${{ steps.alerta.outputs.firma }}
        run: |
          n=$(gh issue list --label alerta-datos --state open --json number -q '.[0].number')
          if [ "$HAY" = "1" ]; then
            if [ -z "$n" ]; then
              gh label create alerta-datos --color D93F0B --description "Fuente caída o serie atrasada" 2>/dev/null || true
              gh issue create --title "Tablero: fuentes caídas o series atrasadas" --label alerta-datos --body-file data/alerta.md
            elif ! gh issue view "$n" --json body -q .body | grep -q "firma: $FIRMA"; then
              gh issue edit "$n" --body-file data/alerta.md
              gh issue comment "$n" --body-file data/alerta.md
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Todas las fuentes responden y ninguna serie está atrasada."
          fi
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
      - id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
