name: Actualización diaria

on:
  schedule:
    - cron: "47 0 * * 2-6"   # 21:47 hora Argentina, de lunes a viernes
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - "config/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - run: python pipeline/run.py
      - name: Guardar datos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Datos $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git pull --rebase
          git push
