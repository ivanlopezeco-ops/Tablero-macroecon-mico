name: Diagnóstico FRED
on:
  push:
    paths: ["tests/diagnostico_fred.py", ".github/workflows/diagnostico-fred.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/diagnostico_fred.py
